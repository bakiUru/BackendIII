paths:
  /api/pets:
    get:
      summary: Get all pets
      description: Returns a list of all pets
      tags: 
        - Pet
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        500:
          description: Internal Server Error


components:
  schemas:
    Pet:
      type: array
      items:
        properties:
          _id: 
            type: ObjectId
            description: Pet ID
          name: 
            type: string
            description: Pet Name
          specie: 
            type: string
            description: Pet Specie
          owner: 
            type: ObjectId
            description: Pet Owner ID
          birthday: 
            type: string
            description: Pet Birthday
          adopted:
            type: boolean
            description: Pet Adoption Status
          image:
            type: string
            description: Pet Image
      example:
        _id: 670c178b1fefdcd526f8a502
        name: ExamplePet 1
        specie: Dog
        adopted: true
        owner: 670c178b1fefdcd526f8a654
        image: https://danspetcare.com/pets/an-extensive-guide-to-the-most-common-dogs
        birthday: 5/10/2020   
