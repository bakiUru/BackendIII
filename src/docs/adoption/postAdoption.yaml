paths:
  /api/adoptions/{uid}/{pid}:
    post:
      summary: Create a new Adoption
      description: Returns a new Adoption
      tags: 
        - Adoptions
      parameters:
        - name: uid
          in: path
          description: User Id
          required: true
          schema:
            type: string
        - name: pid
          in: path
          description: Pet Id
          required: true
          schema:
            type: string
      responses:
        201:
          description: Adoption created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adoption'
        400:
          description: Bad Request
        500:
          description: Internal Server Error

components:
  schemas:
    Adoption:
      type: object
      properties:
        owner:
          type: string
          format: ObjectId
          description: Owner Id
        pet:
          type: string
          format: ObjectId
          description: Pet ID
      example:
        owner: 670c178b1fefdcd312f8a754
        pet: 670c421b1fefdcd526f8a754
    
